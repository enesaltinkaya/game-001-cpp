<html>

<head>
  <link type="text/rcss" href="hud.css" />
</head>

<body>
  <div data-model="hud">
    <div id="stats">
      <div id="level-label">LVL {{ level }}</div>
      <div id="hp-container">
        <div id="hp-fill" data-style-width="(hpPercent * 100 + '%')"></div>
      </div>
      <div id="hp-text">{{ hp }} / {{ maxHp }}</div>
      <div id="mana-container">
        <div id="mana-fill" data-style-width="(manaPercent * 100 + '%')"></div>
      </div>
      <div id="mana-text">{{ mana }} / {{ maxMana }}</div>
      <div id="xp-container">
        <div id="xp-fill" data-style-width="(xpPercent * 100 + '%')"></div>
      </div>

      <div id="xp-container">
        <div id="xp-fill" data-style-width="(xpPercent * 100 + '%')"></div>
      </div>
    </div>

    <div id="damage-numbers">
      <div class="dmg-num" id="dmg0" data-style-left="(dmg0X + 'px')" data-style-top="(dmg0Y + 'px')" data-style-opacity="dmg0Alpha" data-style-color="dmg0Color">{{ dmg0Text }}</div>
      <div class="dmg-num" id="dmg1" data-style-left="(dmg1X + 'px')" data-style-top="(dmg1Y + 'px')" data-style-opacity="dmg1Alpha" data-style-color="dmg1Color">{{ dmg1Text }}</div>
      <div class="dmg-num" id="dmg2" data-style-left="(dmg2X + 'px')" data-style-top="(dmg2Y + 'px')" data-style-opacity="dmg2Alpha" data-style-color="dmg2Color">{{ dmg2Text }}</div>
      <div class="dmg-num" id="dmg3" data-style-left="(dmg3X + 'px')" data-style-top="(dmg3Y + 'px')" data-style-opacity="dmg3Alpha" data-style-color="dmg3Color">{{ dmg3Text }}</div>
      <div class="dmg-num" id="dmg4" data-style-left="(dmg4X + 'px')" data-style-top="(dmg4Y + 'px')" data-style-opacity="dmg4Alpha" data-style-color="dmg4Color">{{ dmg4Text }}</div>
      <div class="dmg-num" id="dmg5" data-style-left="(dmg5X + 'px')" data-style-top="(dmg5Y + 'px')" data-style-opacity="dmg5Alpha" data-style-color="dmg5Color">{{ dmg5Text }}</div>
      <div class="dmg-num" id="dmg6" data-style-left="(dmg6X + 'px')" data-style-top="(dmg6Y + 'px')" data-style-opacity="dmg6Alpha" data-style-color="dmg6Color">{{ dmg6Text }}</div>
      <div class="dmg-num" id="dmg7" data-style-left="(dmg7X + 'px')" data-style-top="(dmg7Y + 'px')" data-style-opacity="dmg7Alpha" data-style-color="dmg7Color">{{ dmg7Text }}</div>
    </div>

    <div id="enemy-health-bars">
      <div class="ehp-wrap" id="ehp0" data-style-left="(ehp0X + 'px')" data-style-top="(ehp0Y + 'px')" data-style-opacity="ehp0Alpha">
        <div class="ehp-bg">
          <div class="ehp-fill" id="ehp0fill" data-style-width="(ehp0Percent * 100 + '%')"></div>
        </div>
      </div>
      <div class="ehp-wrap" id="ehp1" data-style-left="(ehp1X + 'px')" data-style-top="(ehp1Y + 'px')" data-style-opacity="ehp1Alpha">
